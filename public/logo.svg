<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e2d6e"/>
      <stop offset="100%" stop-color="#0c1440"/>
    </radialGradient>
    <linearGradient id="qGrad" x1="25%" y1="15%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Dark circle background -->
  <circle cx="60" cy="60" r="60" fill="url(#bgGrad)"/>

  <!-- Digital pixel dots (top-left area) -->
  <rect x="8"  y="8"  width="5" height="5" rx="1" fill="#3b82f6" opacity="0.9"/>
  <rect x="15" y="8"  width="5" height="5" rx="1" fill="#3b82f6" opacity="0.7"/>
  <rect x="22" y="8"  width="5" height="5" rx="1" fill="#3b82f6" opacity="0.4"/>
  <rect x="8"  y="15" width="5" height="5" rx="1" fill="#3b82f6" opacity="0.7"/>
  <rect x="15" y="15" width="5" height="5" rx="1" fill="#3b82f6" opacity="0.5"/>
  <rect x="22" y="15" width="5" height="5" rx="1" fill="#3b82f6" opacity="0.2"/>
  <rect x="8"  y="22" width="5" height="5" rx="1" fill="#3b82f6" opacity="0.4"/>
  <rect x="15" y="22" width="5" height="5" rx="1" fill="#3b82f6" opacity="0.2"/>

  <!-- Q letter ring -->
  <circle cx="60" cy="57" r="30" fill="none" stroke="url(#qGrad)" stroke-width="12"/>

  <!-- Q tail (diagonal slash extending bottom-right) -->
  <line x1="72" y1="72" x2="90" y2="94" stroke="url(#tailGrad)" stroke-width="10" stroke-linecap="round"/>
</svg>
