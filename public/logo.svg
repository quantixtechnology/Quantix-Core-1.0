<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0d1f6e"/>
      <stop offset="100%" stop-color="#020B3D"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#155BDB"/>
      <stop offset="60%" stop-color="#25B8F5"/>
      <stop offset="100%" stop-color="#7de4ff"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25B8F5"/>
      <stop offset="100%" stop-color="#7de4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bgGrad)"/>

  <!-- Pixel dots grid (top-left, dispersing outward) -->
  <rect x="9"  y="9"  width="6" height="6" rx="1.5" fill="#155BDB" opacity="1"/>
  <rect x="17" y="9"  width="6" height="6" rx="1.5" fill="#155BDB" opacity="0.75"/>
  <rect x="25" y="9"  width="6" height="6" rx="1.5" fill="#25B8F5" opacity="0.45"/>
  <rect x="33" y="9"  width="4" height="4" rx="1"   fill="#25B8F5" opacity="0.2"/>
  <rect x="9"  y="17" width="6" height="6" rx="1.5" fill="#155BDB" opacity="0.75"/>
  <rect x="17" y="17" width="6" height="6" rx="1.5" fill="#25B8F5" opacity="0.5"/>
  <rect x="25" y="17" width="4" height="4" rx="1"   fill="#25B8F5" opacity="0.25"/>
  <rect x="9"  y="25" width="6" height="6" rx="1.5" fill="#155BDB" opacity="0.45"/>
  <rect x="17" y="25" width="4" height="4" rx="1"   fill="#25B8F5" opacity="0.2"/>
  <rect x="9"  y="33" width="4" height="4" rx="1"   fill="#155BDB" opacity="0.2"/>

  <!-- Q ring with glow -->
  <circle cx="59" cy="58" r="26" fill="none" stroke="url(#ringGrad)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Q tail (bottom-right diagonal) -->
  <line x1="75" y1="74" x2="97" y2="100" stroke="url(#tailGrad)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
</svg>
