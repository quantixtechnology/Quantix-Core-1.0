name: quantix_customer
description: Quantix Customer App — white-label e-commerce for Android & iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: "^3.8.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^17.2.3

  # ── HTTP / API ──────────────────────────────────────────────────────────────
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # ── Serialization / Models ──────────────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^18.0.1

  # ── WebSocket / Realtime ────────────────────────────────────────────────────
  socket_io_client: ^3.1.4

  # ── Maps ────────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.7.0

  # ── Local Storage ───────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1

  # ── UI / UX ─────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  badges: ^3.1.2
  pinput: ^6.0.2                   # OTP input
  intl: ^0.20.2

  # ── Utilities ───────────────────────────────────────────────────────────────
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.0
  share_plus: ^12.0.2
  image_picker: ^1.1.2
  permission_handler: ^12.0.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  logger: ^2.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ─────────────────────────────────────────────────────────
  build_runner: ^2.4.12
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
