name: quantix_customer
description: Quantix Customer App — white-label e-commerce for Android & iOS.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── HTTP / API ──────────────────────────────────────────────────────────────
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # ── Serialization / Models ──────────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Firebase ────────────────────────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # ── WebSocket / Realtime ────────────────────────────────────────────────────
  socket_io_client: ^2.0.3+1

  # ── Maps ────────────────────────────────────────────────────────────────────
  google_maps_flutter: ^2.7.0

  # ── Local Storage ───────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # ── UI / UX ─────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  badges: ^3.1.2
  pinput: ^3.0.1                   # OTP input
  intl: ^0.19.0

  # ── Utilities ───────────────────────────────────────────────────────────────
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  logger: ^2.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code Generation ─────────────────────────────────────────────────────────
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
