name: Deploy to Hostinger VPS

# ─── Why webhook instead of SSH? ──────────────────────────────────────────────
# Hostinger's firewall silently drops inbound TCP from GitHub Actions runner
# IPs. Instead of the runner SSHing IN to the VPS, the runner POSTs an HTTPS
# webhook to the running app (port 443 is always open). The app spawns
# deploy-local.sh as a DETACHED process that survives the PM2 restart which
# happens mid-build. GitHub Actions then polls /api/deploy/status until the
# script reports "success" or "failed".
#
# Required GitHub Secrets:
#   DEPLOY_WEBHOOK_SECRET  — random string ≥32 chars; also in VPS .env
#   DEPLOY_APP_URL         — e.g. https://app.quantixtechnology.in  (no trailing slash)
#
# Optional GitHub Secrets:
#   DEPLOY_VPS_IP          — VPS direct IP (bypasses Cloudflare bot challenge)
#                            Get it: ssh vps "curl -s ifconfig.me"
#                            This is needed when Cloudflare returns HTTP 403
#                            for the /api/deploy webhook call.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger & Monitor Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── Step 1: Validate secrets ───────────────────────────────────────────
      - name: Validate secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" ] && MISSING="$MISSING DEPLOY_WEBHOOK_SECRET"
          [ -z "${{ secrets.DEPLOY_APP_URL }}"        ] && MISSING="$MISSING DEPLOY_APP_URL"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            echo ""
            echo "Add these in: GitHub repo → Settings → Secrets → Actions"
            echo "  DEPLOY_WEBHOOK_SECRET  random 32-char string (same value in VPS .env)"
            echo "  DEPLOY_APP_URL         e.g. https://app.quantixtechnology.in"
            exit 1
          fi
          echo "✅ Secrets present"
          if [ -n "${{ secrets.DEPLOY_VPS_IP }}" ]; then
            echo "✅ DEPLOY_VPS_IP set — will bypass Cloudflare via direct VPS IP"
          else
            echo "ℹ️  DEPLOY_VPS_IP not set — routing through Cloudflare"
          fi

      # ── Step 1.5: Check build deployment ──────────────────────────────────────
      - name: Verify build is deployed
        run: |
          APP_URL="${{ secrets.DEPLOY_APP_URL }}"
          VPS_IP="${{ secrets.DEPLOY_VPS_IP }}"

          RESOLVE_FLAG=""
          if [ -n "$VPS_IP" ]; then
            HOSTNAME=$(echo "$APP_URL" | sed 's|https\?://||' | cut -d'/' -f1 | cut -d':' -f1)
            if echo "$VPS_IP" | grep -q ':'; then
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:[${VPS_IP}]"
            else
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:${VPS_IP}"
            fi
          fi

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Checking if latest build is deployed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          echo "GET ${APP_URL}/api/build-info"
          curl -s --max-time 10 $RESOLVE_FLAG "${APP_URL}/api/build-info" 2>/dev/null | jq . || echo "❌ Cannot reach /api/build-info"

          echo ""
          echo "GET ${APP_URL}/api/deploy/module"
          curl -s --max-time 10 $RESOLVE_FLAG "${APP_URL}/api/deploy/module" 2>/dev/null | jq . || echo "❌ Cannot reach /api/deploy/module"

          echo ""
          echo "GET ${APP_URL}/api/deploy/state"
          curl -s --max-time 10 $RESOLVE_FLAG "${APP_URL}/api/deploy/state" 2>/dev/null | jq . || echo "❌ Cannot reach /api/deploy/state"

      # ── Step 2: Trigger deploy webhook ────────────────────────────────────
      - name: Trigger deploy webhook
        id: trigger
        continue-on-error: true
        run: |
          APP_URL="${{ secrets.DEPLOY_APP_URL }}"
          SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
          VPS_IP="${{ secrets.DEPLOY_VPS_IP }}"
          TIMESTAMP=$(date +%s)

          RESOLVE_FLAG=""
          if [ -n "$VPS_IP" ]; then
            HOSTNAME=$(echo "$APP_URL" | sed 's|https\?://||' | cut -d'/' -f1 | cut -d':' -f1)
            if echo "$VPS_IP" | grep -q ':'; then
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:[${VPS_IP}]"
            else
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:${VPS_IP}"
            fi
          fi

          echo "POST ${APP_URL}/api/deploy (timestamp=${TIMESTAMP})"
          echo ""

          # Capture full HTTP response including headers
          curl -i --max-time 30 \
            $RESOLVE_FLAG \
            -X POST \
            -H "x-deploy-secret: ${SECRET}" \
            -H "x-deploy-timestamp: ${TIMESTAMP}" \
            -H "Content-Type: application/json" \
            "${APP_URL}/api/deploy" > /tmp/trigger_full_response.txt 2>&1

          # Extract HTTP status code from the response
          HTTP_CODE=$(head -1 /tmp/trigger_full_response.txt | grep -oE '[0-9]+' | head -1)
          echo "HTTP Status: ${HTTP_CODE}"
          echo ""
          echo "Full response:"
          cat /tmp/trigger_full_response.txt
          echo ""

          # Save for diagnostic step
          echo "HTTP_CODE=${HTTP_CODE}" >> /tmp/trigger_state.env
          echo "RESOLVE_FLAG=${RESOLVE_FLAG}" >> /tmp/trigger_state.env
          echo "APP_URL=${APP_URL}" >> /tmp/trigger_state.env

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "409" ]; then
            echo "✅ Webhook accepted (HTTP ${HTTP_CODE})"
            exit 0
          else
            echo "❌ Webhook trigger failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

      # ── Step 2b: Collect execution diagnostics (always) ───────────────────────
      - name: Collect execution diagnostics
        if: always()
        continue-on-error: true
        run: |
          source /tmp/trigger_state.env 2>/dev/null || true

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  WEBHOOK RESPONSE (Raw)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -f /tmp/trigger_full_response.txt ]; then
            head -100 /tmp/trigger_full_response.txt
          else
            echo "No response captured"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  MODULE LOAD STATUS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -n "$RESOLVE_FLAG" ] && [ -n "$APP_URL" ]; then
            curl -s --max-time 10 $RESOLVE_FLAG "${APP_URL}/api/deploy/module" 2>/dev/null | jq . || echo "❌ Cannot reach /api/deploy/module"
          else
            echo "❌ Cannot reconstruct RESOLVE_FLAG"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  HANDLER EXECUTION STATE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -n "$RESOLVE_FLAG" ] && [ -n "$APP_URL" ]; then
            curl -s --max-time 10 $RESOLVE_FLAG "${APP_URL}/api/deploy/state" 2>/dev/null | jq . || echo "❌ Cannot reach /api/deploy/state"
          else
            echo "❌ Cannot reconstruct RESOLVE_FLAG"
          fi

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "409" ]; then
            echo ""
            echo "❌ Deploy webhook failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      # ── Step 3: Poll status until done ────────────────────────────────────
      - name: Wait for deploy to complete
        run: |
          APP_URL="${{ secrets.DEPLOY_APP_URL }}"
          SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
          VPS_IP="${{ secrets.DEPLOY_VPS_IP }}"
          MAX_POLLS=40
          POLL=0

          RESOLVE_FLAG=""
          if [ -n "$VPS_IP" ]; then
            HOSTNAME=$(echo "$APP_URL" | sed 's|https\?://||' | cut -d'/' -f1 | cut -d':' -f1)
            if echo "$VPS_IP" | grep -q ':'; then
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:[${VPS_IP}]"
            else
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:${VPS_IP}"
            fi
          fi

          echo "Polling ${APP_URL}/api/deploy/status …"

          while [ "$POLL" -lt "$MAX_POLLS" ]; do
            sleep 30
            POLL=$((POLL + 1))

            # Capture full HTTP response including headers and status code
            curl -i --max-time 20 \
              $RESOLVE_FLAG \
              -H "x-deploy-secret: ${SECRET}" \
              "${APP_URL}/api/deploy/status" > /tmp/poll_response.txt 2>&1 || echo "CURL_FAILED" >> /tmp/poll_response.txt

            # Extract HTTP status code (first line)
            HTTP_STATUS=$(head -1 /tmp/poll_response.txt | grep -oE '[0-9]{3}' | head -1 || echo "000")

            # Extract headers and body
            RESPONSE=$(tail -n +2 /tmp/poll_response.txt | sed '/^[[:space:]]*$/d' | tail -n +2)

            echo "[$POLL/$MAX_POLLS] HTTP ${HTTP_STATUS}"

            # Guard: if the response is not valid JSON, show what we got
            if ! echo "$RESPONSE" | jq -e . > /dev/null 2>&1; then
              CONTENT_TYPE=$(grep -i "^content-type:" /tmp/poll_response.txt | cut -d' ' -f2- || echo "unknown")
              BODY_PREVIEW=$(head -c 300 /tmp/poll_response.txt | tail -c +1)
              echo "  ⚠️  Non-JSON response"
              echo "  Content-Type: ${CONTENT_TYPE}"
              echo "  Preview: ${BODY_PREVIEW}"
              continue
            fi

            STATUS=$(echo "$RESPONSE" | jq -r '.status  // "unknown"')
            STEP=$(echo "$RESPONSE"   | jq -r '.step    // ""')
            MSG=$(echo "$RESPONSE"    | jq -r '.message // ""')
            COMMIT=$(echo "$RESPONSE" | jq -r '.commit  // ""')

            echo "  status=${STATUS} step=${STEP} — ${MSG}"

            if [ "$STATUS" = "success" ]; then
              echo ""
              echo "✅ Deploy complete${COMMIT:+ — commit ${COMMIT}}"
              echo "─── Last log lines ───────────────────────────────────────"
              echo "$RESPONSE" | jq -r '.tail[-20:][]? // empty' 2>/dev/null || true
              exit 0
            fi

            if [ "$STATUS" = "failed" ]; then
              echo ""
              echo "❌ Deploy failed at step: ${STEP}"
              echo "   ${MSG}"
              echo "─── Deploy log (last 30 lines) ───────────────────────────"
              echo "$RESPONSE" | jq -r '.tail[-30:][]? // empty' 2>/dev/null || true
              exit 1
            fi
          done

          echo "⏱  Timed out after $((MAX_POLLS * 30))s"
          echo "   Check VPS: pm2 logs quantix-core --lines 50"
          echo "   Status:    cat /tmp/quantix-deploy-status.json" # This file name is fine.
          exit 1

      # ── Step 3b: Collect execution diagnostics on polling timeout ──────────────
      - name: Collect execution diagnostics (on polling timeout)
        if: failure()
        continue-on-error: true
        run: |
          APP_URL="${{ secrets.DEPLOY_APP_URL }}"
          SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
          VPS_IP="${{ secrets.DEPLOY_VPS_IP }}"

          RESOLVE_FLAG=""
          if [ -n "$VPS_IP" ]; then
            HOSTNAME=$(echo "$APP_URL" | sed 's|https\?://||' | cut -d'/' -f1 | cut -d':' -f1)
            if echo "$VPS_IP" | grep -q ':'; then
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:[${VPS_IP}]"
            else
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:${VPS_IP}"
            fi
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  LAST /api/deploy/status RESPONSE (Raw)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -f /tmp/poll_response.txt ]; then
            head -50 /tmp/poll_response.txt
          else
            echo "No poll response captured"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  BUILD INFO (what version is running?)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          curl -s --max-time 10 $RESOLVE_FLAG "${APP_URL}/api/build-info" 2>/dev/null | jq . || echo "❌ Cannot reach /api/build-info"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  MODULE LOAD STATUS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          curl -s --max-time 10 $RESOLVE_FLAG "${APP_URL}/api/deploy/module" 2>/dev/null | jq . || echo "❌ Cannot reach module endpoint"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  HANDLER EXECUTION STATE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          curl -s --max-time 10 $RESOLVE_FLAG "${APP_URL}/api/deploy/state" 2>/dev/null | jq . || echo "❌ Cannot reach state endpoint"
