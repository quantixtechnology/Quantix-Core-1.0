name: Deploy to Hostinger VPS

# ============================================================================
# Deployment via self-hosted GitHub Actions runner installed on the VPS.
#
# The runner connects OUTBOUND to GitHub — no inbound SSH needed.
# Hostinger firewall rules are irrelevant.
#
# One-time setup (run on VPS via Hostinger web terminal):
#   bash /root/Quantix-Core-1.0/scripts/install-runner.sh <REGISTRATION_TOKEN>
#
# Get the token at:
#   github.com → quantixtechnology/Quantix-Core-1.0 →
#   Settings → Actions → Runners → New self-hosted runner
#   (copy the --token value from the configure step)
# ============================================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted        # ← runs directly on the VPS, no SSH needed
    timeout-minutes: 30

    steps:
      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " QUANTIX DEPLOY — $(date)"
          echo "============================================================"
          echo "User   : $(whoami)"
          echo "Runner : $(hostname)"
          echo "Node   : $(node --version 2>/dev/null || echo NOT FOUND)"
          echo "NPM    : $(npm --version  2>/dev/null || echo NOT FOUND)"
          echo "PM2    : $(pm2 --version  2>/dev/null || echo NOT FOUND)"
          echo "Disk   : $(df -h / | tail -1 | awk '{print $4" free of "$2}')"
          echo ""

          PROJECT="/root/Quantix-Core-1.0"
          DB_FILE="/root/quantix-data/custom.db"
          export DATABASE_URL="file:$DB_FILE"
          echo "Path : $PROJECT"
          echo "DB   : $DB_FILE"

          [ ! -d "$PROJECT" ] && echo "❌ Project directory not found" && exit 1
          cd "$PROJECT"

          echo ""
          echo "── DB backup ────────────────────────────────────────────────"
          mkdir -p /root/backups
          if [ -f "$DB_FILE" ]; then
            BACKUP="/root/backups/custom.db.$(date +%Y%m%d-%H%M%S).bak"
            cp "$DB_FILE" "$BACKUP"
            echo "✅ DB backed up → $BACKUP"
            ls -t /root/backups/custom.db.*.bak 2>/dev/null | tail -n +11 | xargs rm -f || true
          else
            echo "ℹ️  No existing DB (first deploy)"
          fi

          echo ""
          echo "── Git ──────────────────────────────────────────────────────"
          git fetch --quiet origin main
          mkdir -p "$(dirname "$DB_FILE")"
          git reset --hard origin/main
          echo "Commit: $(git rev-parse --short HEAD) — $(git log -1 --pretty='%s')"

          echo ""
          echo "── DATABASE_URL in .env ─────────────────────────────────────"
          touch "$PROJECT/.env"
          grep -v "^DATABASE_URL=" "$PROJECT/.env" > /tmp/env_tmp || true
          { echo "DATABASE_URL=file:$DB_FILE"; cat /tmp/env_tmp; } > "$PROJECT/.env"
          echo "✅ DATABASE_URL written to $PROJECT/.env"

          echo ""
          echo "── npm install ──────────────────────────────────────────────"
          npm install --legacy-peer-deps 2>&1 | tail -5
          echo "✅ Dependencies ready"

          echo ""
          echo "── Prisma ───────────────────────────────────────────────────"
          npx prisma generate 2>&1 | tail -2
          npx prisma db push --accept-data-loss 2>&1 | tail -2
          echo "✅ Schema synced"

          echo ""
          echo "── Super Admin ──────────────────────────────────────────────"
          node scripts/ensure-super-admin.js
          echo "✅ Super admin verified"

          echo ""
          echo "── next build ───────────────────────────────────────────────"
          npm run build 2>&1
          echo "✅ Build complete"

          echo ""
          echo "── Standalone assets ────────────────────────────────────────"
          STANDALONE="$PROJECT/.next/standalone"
          if [ -d "$STANDALONE" ]; then
            cp -r "$PROJECT/.next/static" "$STANDALONE/.next/" 2>/dev/null || true
            cp -r "$PROJECT/public"       "$STANDALONE/"       2>/dev/null || true
            {
              echo "DATABASE_URL=file:$DB_FILE"
              echo "PORT=3000"
              echo "HOSTNAME=0.0.0.0"
              grep -v "^DATABASE_URL\|^PORT\|^HOSTNAME" "$PROJECT/.env" 2>/dev/null || true
            } > "$STANDALONE/.env"
            echo "✅ Assets + .env written to standalone"
          else
            echo "❌ Standalone directory missing — build failed"
            exit 1
          fi

          echo ""
          echo "── PM2 ──────────────────────────────────────────────────────"
          if pm2 list 2>/dev/null | grep -q "quantix"; then
            pm2 restart quantix --update-env
          else
            pm2 start ecosystem.config.js
          fi
          pm2 save
          pm2 list

          echo ""
          echo "── Health check ─────────────────────────────────────────────"
          sleep 12
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://localhost:3000 2>/dev/null || echo "000")
          if echo "$HTTP" | grep -qE "^(200|301|302|307|308)$"; then
            echo "✅ App healthy (HTTP $HTTP)"
          else
            echo "⚠️  Health check HTTP $HTTP — showing PM2 logs:"
            pm2 logs quantix --lines 30 --nostream 2>/dev/null || true
          fi

          echo ""
          echo "============================================================"
          echo " DEPLOY COMPLETE — $(date)"
          echo "============================================================"
