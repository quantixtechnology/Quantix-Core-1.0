name: Deploy to Hostinger VPS

# ─── Why webhook instead of SSH? ──────────────────────────────────────────────
# Hostinger's firewall silently drops inbound TCP from GitHub Actions runner
# IPs. Instead of the runner SSHing IN to the VPS, the runner POSTs an HTTPS
# webhook to the running app (port 443 is always open). The app spawns
# deploy-local.sh as a DETACHED process that survives the PM2 restart which
# happens mid-build. GitHub Actions then polls /api/deploy/status until the
# script reports "success" or "failed".
#
# Required GitHub Secrets:
#   DEPLOY_WEBHOOK_SECRET  — random string ≥32 chars; also in VPS .env
#   DEPLOY_APP_URL         — e.g. https://app.quantixtechnology.in  (no trailing slash)
#
# Optional GitHub Secrets:
#   DEPLOY_VPS_IP          — VPS direct IP (bypasses Cloudflare bot challenge)
#                            Get it: ssh vps "curl -s ifconfig.me"
#                            This is needed when Cloudflare returns HTTP 403
#                            for the /api/deploy webhook call.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger & Monitor Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── Step 1: Validate secrets ───────────────────────────────────────────
      - name: Validate secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" ] && MISSING="$MISSING DEPLOY_WEBHOOK_SECRET"
          [ -z "${{ secrets.DEPLOY_APP_URL }}"        ] && MISSING="$MISSING DEPLOY_APP_URL"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            echo ""
            echo "Add these in: GitHub repo → Settings → Secrets → Actions"
            echo "  DEPLOY_WEBHOOK_SECRET  random 32-char string (same value in VPS .env)"
            echo "  DEPLOY_APP_URL         e.g. https://app.quantixtechnology.in"
            exit 1
          fi
          echo "✅ Secrets present"
          if [ -n "${{ secrets.DEPLOY_VPS_IP }}" ]; then
            echo "✅ DEPLOY_VPS_IP set — will bypass Cloudflare via direct VPS IP"
          else
            echo "ℹ️  DEPLOY_VPS_IP not set — routing through Cloudflare"
          fi

      # ── Step 2: Trigger deploy webhook ────────────────────────────────────
      - name: Trigger deploy webhook
        run: |
          APP_URL="${{ secrets.DEPLOY_APP_URL }}"
          SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
          VPS_IP="${{ secrets.DEPLOY_VPS_IP }}"
          TIMESTAMP=$(date +%s)

          # When DEPLOY_VPS_IP is set, use --resolve to connect directly to the VPS
          # IP while still sending the correct Host header and TLS SNI. This bypasses
          # Cloudflare's bot-protection challenge (HTTP 403) without changing any
          # server-side config or touching the Cloudflare dashboard.
          RESOLVE_FLAG=""
          if [ -n "$VPS_IP" ]; then
            HOSTNAME=$(echo "$APP_URL" | sed 's|https\?://||' | cut -d'/' -f1 | cut -d':' -f1)
            # IPv6 addresses must be wrapped in square brackets for curl --resolve
            if echo "$VPS_IP" | grep -q ':'; then
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:[${VPS_IP}]"
            else
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:${VPS_IP}"
            fi
          fi

          echo "POST ${APP_URL}/api/deploy (timestamp=${TIMESTAMP})"

          HTTP_CODE=$(curl -s -o /tmp/trigger_body.json -w "%{http_code}" \
            --max-time 30 \
            $RESOLVE_FLAG \
            -X POST \
            -H "x-deploy-secret: ${SECRET}" \
            -H "x-deploy-timestamp: ${TIMESTAMP}" \
            -H "Content-Type: application/json" \
            "${APP_URL}/api/deploy")

          BODY=$(cat /tmp/trigger_body.json 2>/dev/null || echo "{}")
          echo "HTTP ${HTTP_CODE} — ${BODY}"

          if [ "$HTTP_CODE" = "409" ]; then
            echo "⚠️  Deploy already in progress — polling status without re-triggering"

          elif [ "$HTTP_CODE" = "403" ]; then
            # Check if this looks like a Cloudflare challenge page
            if echo "$BODY" | grep -qi "cloudflare\|just a moment\|challenge-platform\|enable javascript"; then
              echo ""
              echo "❌ Cloudflare is blocking the webhook (HTTP 403 managed challenge)"
              echo "   The bot-protection challenge cannot be solved by curl."
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "  Fix option A — Direct VPS IP (recommended, no Cloudflare change)"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "  1. Get your VPS IP:  ssh user@vps 'curl -s ifconfig.me'"
              echo "  2. GitHub repo → Settings → Secrets and variables → Actions"
              echo "  3. Add secret:  Name=DEPLOY_VPS_IP  Value=<your VPS IP>"
              echo "  That's it — next push will route curl directly to the VPS,"
              echo "  bypassing Cloudflare while keeping TLS valid."
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "  Fix option B — Cloudflare WAF bypass rule"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "  Cloudflare dashboard → Security → WAF → Custom Rules → Create"
              echo "  Name: Allow deploy webhook"
              echo "  Expression: (http.request.uri.path eq \"/api/deploy\")"
              echo "  Action: Skip → Skip all remaining custom rules"
              echo "  (The x-deploy-secret header still protects the endpoint.)"
            else
              echo "❌ Webhook returned 403 — check DEPLOY_WEBHOOK_SECRET matches VPS .env"
            fi
            exit 1

          elif [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Webhook trigger failed (HTTP ${HTTP_CODE})"
            echo "   Is the app up? curl ${APP_URL}"
            echo "   Is DEPLOY_WEBHOOK_SECRET set in both GitHub Secrets and VPS .env?"
            exit 1

          else
            echo "✅ Deploy triggered"
          fi

      # ── Step 3: Poll status until done ────────────────────────────────────
      - name: Wait for deploy to complete
        run: |
          APP_URL="${{ secrets.DEPLOY_APP_URL }}"
          SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
          VPS_IP="${{ secrets.DEPLOY_VPS_IP }}"
          MAX_POLL_TIME=600  # 10 minutes total (extended from 20 min to be safer)
          START_TIME=$(date +%s)
          POLL=0
          CONSECUTIVE_FAILS=0

          RESOLVE_FLAG=""
          if [ -n "$VPS_IP" ]; then
            HOSTNAME=$(echo "$APP_URL" | sed 's|https\?://||' | cut -d'/' -f1 | cut -d':' -f1)
            if echo "$VPS_IP" | grep -q ':'; then
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:[${VPS_IP}]"
            else
              RESOLVE_FLAG="--resolve ${HOSTNAME}:443:${VPS_IP}"
            fi
          fi

          echo "Polling ${APP_URL}/api/deploy/status …"
          echo "(Deployment may take several minutes; temporary non-JSON responses are normal during app restart)"
          echo ""

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            POLL=$((POLL + 1))

            # Exponential backoff: 5s, 10s, 15s, 20s, 30s, 30s...
            # Start aggressive (detect quick failures early), then back off
            if [ $POLL -le 2 ]; then
              SLEEP=5
            elif [ $POLL -le 4 ]; then
              SLEEP=10
            elif [ $POLL -le 6 ]; then
              SLEEP=15
            elif [ $POLL -le 8 ]; then
              SLEEP=20
            else
              SLEEP=30
            fi

            if [ $ELAPSED -gt $MAX_POLL_TIME ]; then
              echo ""
              echo "⏱  Timed out after ${ELAPSED}s (>${MAX_POLL_TIME}s limit)"
              echo "   Check VPS: pm2 logs quantix --lines 100"
              echo "   Status:    cat /tmp/quantix-deploy-status.json"
              exit 1
            fi

            sleep "$SLEEP"

            # Fetch status — curl's timeout includes connect time
            RESPONSE=$(curl -s --max-time 15 \
              $RESOLVE_FLAG \
              -H "x-deploy-secret: ${SECRET}" \
              "${APP_URL}/api/deploy/status" 2>/dev/null)

            # Guard: if the response is not valid JSON (e.g., Nginx 502 during
            # app restart), treat it as a temporary restart and continue polling.
            if ! echo "$RESPONSE" | jq -e . > /dev/null 2>&1; then
              CONSECUTIVE_FAILS=$((CONSECUTIVE_FAILS + 1))
              REMAINING=$((MAX_POLL_TIME - ELAPSED))
              echo "[$POLL | ${ELAPSED}s/${MAX_POLL_TIME}s] ⚠️  Non-JSON response (app restarting?) — attempt $CONSECUTIVE_FAILS, sleeping ${SLEEP}s…"

              # Allow up to 6 consecutive non-JSON responses (~90 seconds with backoff)
              # before giving up on connection issues
              if [ $CONSECUTIVE_FAILS -gt 6 ]; then
                echo ""
                echo "❌ Too many non-JSON responses — app may be permanently unreachable"
                exit 1
              fi
              continue
            fi

            # Reset consecutive fails when we get valid JSON
            CONSECUTIVE_FAILS=0

            STATUS=$(echo "$RESPONSE" | jq -r '.status  // "unknown"')
            STEP=$(echo "$RESPONSE"   | jq -r '.step    // ""')
            MSG=$(echo "$RESPONSE"    | jq -r '.message // ""')
            COMMIT=$(echo "$RESPONSE" | jq -r '.commit  // ""')

            echo "[$POLL | ${ELAPSED}s/${MAX_POLL_TIME}s] status=${STATUS} step=${STEP} — ${MSG}"

            if [ "$STATUS" = "success" ]; then
              echo ""
              echo "✅ Deploy complete${COMMIT:+ — commit ${COMMIT}} (${ELAPSED}s)"
              echo "─── Last 20 log lines ───────────────────────────────────────"
              echo "$RESPONSE" | jq -r '.tail[-20:][]? // empty' 2>/dev/null || true
              exit 0
            fi

            if [ "$STATUS" = "failed" ]; then
              echo ""
              echo "❌ Deploy failed at step: ${STEP}"
              echo "   Reason: ${MSG}"
              echo "─── Deploy log (last 30 lines) ───────────────────────────"
              echo "$RESPONSE" | jq -r '.tail[-30:][]? // empty' 2>/dev/null || true
              exit 1
            fi

            # Continue polling for "running", "queued", "restart", etc.
          done
