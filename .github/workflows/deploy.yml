name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ── Step 1: Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Validate secrets ──────────────────────────────────────────────
      - name: Validate secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.VPS_HOST }}"    ] && MISSING="$MISSING VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}"    ] && MISSING="$MISSING VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && MISSING="$MISSING VPS_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            exit 1
          fi
          echo "✅ Secrets present — host=${{ secrets.VPS_HOST }} user=${{ secrets.VPS_USER }}"

      # ── Step 3: Setup SSH (no third-party action needed) ──────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add VPS to known_hosts to avoid interactive prompt
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "✅ SSH key written and VPS added to known_hosts"

      # ── Step 4: Test TCP connectivity (informational only) ───────────────────
      # Non-fatal — if TCP pre-check fails the SSH step will surface the real error.
      # Common cause: Hostinger firewall blocks GitHub Actions IP ranges on port 22;
      # try a custom SSH port (e.g. 2222) set via VPS_PORT secret.
      - name: Test VPS connectivity
        continue-on-error: true
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          HOST="${{ secrets.VPS_HOST }}"
          echo "ℹ️  Checking TCP $HOST:$PORT …"
          for i in 1 2 3; do
            if timeout 10 bash -c "echo >/dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "✅ TCP reachable (attempt $i)"
              exit 0
            fi
            echo "⚠️  Attempt $i/3 failed — retrying in 10s…"
            [ $i -lt 3 ] && sleep 10
          done
          echo "⚠️  TCP pre-check could not reach $HOST:$PORT — proceeding to SSH step anyway."
          echo "   If SSH also fails, verify: (1) VPS is running, (2) VPS_PORT secret matches"
          echo "   the SSH port on the server, (3) Hostinger firewall allows GitHub Actions IPs."

      # ── Step 5: Deploy via native SSH ─────────────────────────────────────────
      # No third-party action — avoids all command_timeout parsing bugs.
      # Script is piped via stdin; ServerAliveInterval keeps the connection alive
      # during the long npm run build step.
      - name: Deploy via SSH
        run: |
          PORT="${{ secrets.VPS_PORT }}"
          PORT="${PORT:-22}"
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$PORT" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=20 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash -e -o pipefail' << 'DEPLOY'

          echo "============================================================"
          echo " QUANTIX DEPLOY — $(date)"
          echo "============================================================"
          echo "User : $(whoami)"
          echo "Node : $(node --version 2>/dev/null || echo NOT FOUND)"
          echo "NPM  : $(npm --version  2>/dev/null || echo NOT FOUND)"
          echo "PM2  : $(pm2 --version  2>/dev/null || echo NOT FOUND)"
          echo "Disk : $(df -h / | tail -1 | awk '{print $4" free of "$2}')"
          echo ""

          PROJECT="/root/Quantix-Core-1.0"
          DB_FILE="$PROJECT/prisma/db/custom.db"
          export DATABASE_URL="file:$DB_FILE"
          echo "Path : $PROJECT"
          echo "DB   : $DB_FILE"

          [ ! -d "$PROJECT" ] && echo "❌ Project directory not found" && exit 1
          cd "$PROJECT"

          echo ""
          echo "── Git ──────────────────────────────────────────────────────"
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "Commit: $(git rev-parse --short HEAD) — $(git log -1 --pretty='%s')"

          echo ""
          echo "── npm install ──────────────────────────────────────────────"
          npm install --legacy-peer-deps 2>&1 | tail -5
          echo "✅ Dependencies ready"

          echo ""
          echo "── Prisma ───────────────────────────────────────────────────"
          npx prisma generate 2>&1 | tail -2
          npx prisma db push --accept-data-loss 2>&1 | tail -2
          echo "✅ Schema synced"

          echo ""
          echo "── Super Admin ──────────────────────────────────────────────"
          node scripts/ensure-super-admin.js
          echo "✅ Super admin verified"

          echo ""
          echo "── next build ───────────────────────────────────────────────"
          npm run build 2>&1
          echo "✅ Build complete"

          echo ""
          echo "── Standalone assets ────────────────────────────────────────"
          STANDALONE="$PROJECT/.next/standalone"
          if [ -d "$STANDALONE" ]; then
            cp -r "$PROJECT/.next/static" "$STANDALONE/.next/" 2>/dev/null || true
            cp -r "$PROJECT/public"        "$STANDALONE/"       2>/dev/null || true
            {
              echo "DATABASE_URL=file:$DB_FILE"
              echo "PORT=3000"
              echo "HOSTNAME=0.0.0.0"
              grep -v "^DATABASE_URL\|^PORT\|^HOSTNAME" "$PROJECT/.env" 2>/dev/null || true
            } > "$STANDALONE/.env"
            echo "✅ Assets + .env written to standalone"
          fi

          echo ""
          echo "── PM2 ──────────────────────────────────────────────────────"
          if pm2 list 2>/dev/null | grep -q "quantix"; then
            pm2 restart quantix --update-env
          else
            pm2 start npm --name quantix -- start
          fi
          pm2 save
          pm2 list

          echo ""
          echo "── Health check ─────────────────────────────────────────────"
          sleep 12
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 http://localhost:3000 2>/dev/null || echo "000")
          if echo "$HTTP" | grep -qE "^(200|301|302|307|308)$"; then
            echo "✅ App healthy (HTTP $HTTP)"
          else
            echo "⚠️  Health check HTTP $HTTP — showing last PM2 logs:"
            pm2 logs quantix --lines 30 --nostream 2>/dev/null || true
          fi

          echo ""
          echo "============================================================"
          echo " DEPLOY COMPLETE — $(date)"
          echo "============================================================"
          DEPLOY
