name: Deploy to Hostinger VPS

# ─── Deployment architecture ───────────────────────────────────────────────────
# A GitHub Actions self-hosted runner is installed ON the VPS
# (/root/actions-runner). The runner maintains an outbound HTTPS connection
# to GitHub — no inbound SSH, no firewall changes needed.
#
# On push to main the runner receives the job and executes
# scripts/deploy-local.sh directly on the VPS. This is simpler than the
# webhook approach: no GitHub Secrets, no HTTP polling, no timing issues.
#
# One-time setup (run once on the VPS):
#   1. Get a registration token:
#        github.com → quantixtechnology/Quantix-Core-1.0 →
#        Settings → Actions → Runners → New self-hosted runner → copy token
#   2. Run: bash /root/Quantix-Core-1.0/scripts/install-runner.sh <TOKEN>
#   3. The runner service starts automatically and persists across reboots.
#
# After that, every push to main deploys automatically.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      # deploy-local.sh handles everything: DB backup → git pull → npm install
      # → prisma → next build → standalone assets → pm2 restart → health check.
      # It writes progress to /tmp/quantix-deploy-status.json; the exit code
      # (0 = success, 1 = failed) drives the workflow pass/fail status.
      - name: Run deploy script
        run: bash /root/Quantix-Core-1.0/scripts/deploy-local.sh
